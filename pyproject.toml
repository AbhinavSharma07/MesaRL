[project]
name = "mesarl"
version = "0.1.0"
description = "MesaRL — reverse-engineering an emergent mesa-optimizer via Transformer meta-RL"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "typer>=0.12",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langgraph>=0.1",
    "gradio>=4.44",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.1"]
dev = ["pytest>=7.4"]

[project.scripts]
mesarl = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
